<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #screen { width: 100%; height: 100%; }
  #status { position: fixed; top: 8px; left: 8px; color: #fff; font-family: sans-serif; font-size: 12px; z-index: 10; }
</style>
</head>
<body>
<div id="status">Connecting…</div>
<div id="screen"></div>
<script type="module">
  import RFB from './novnc/core/rfb.js';

  const statusEl = document.getElementById('status');

  window.oikosConnect = function (url) {
    const target = document.getElementById('screen');
    const rfb = new RFB(target, url, { credentials: {} });
    rfb.scaleViewport = true;
    rfb.resizeSession = true;
    window._oikosRfb = rfb;

    rfb.addEventListener('connect', () => { statusEl.style.display = 'none'; });
    rfb.addEventListener('disconnect', () => {
      statusEl.textContent = 'Disconnected';
      statusEl.style.display = 'block';
    });
    rfb.addEventListener('credentialsrequired', () => {
      statusEl.textContent = 'Authentication failed';
    });
  };
</script>
</body>
</html>
