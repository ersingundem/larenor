<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="./xterm/css/xterm.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; }
  #term { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="term"></div>
<script src="./xterm/lib/xterm.js"></script>
<script>
  var term = new Terminal({ cursorBlink: true, convertEol: true, fontSize: 14 });
  term.open(document.getElementById('term'));

  window.larenorConnect = function (url) {
    var ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';

    ws.onopen = function () { term.writeln('Connected.'); };
    ws.onmessage = function (event) {
      var data = event.data;
      if (data instanceof ArrayBuffer) {
        term.write(new Uint8Array(data));
      } else {
        term.write(data);
      }
    };
    ws.onclose = function () { term.writeln('\r\n\r\nDisconnected.'); };
    ws.onerror = function () { term.writeln('\r\n\r\nConnection error.'); };

    term.onData(function (data) {
      if (ws.readyState === WebSocket.OPEN) ws.send(data);
    });
  };
</script>
</body>
</html>
