name: Android Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build

      # Android's SDK now ships fractional platform revisions (e.g.
      # android-37.0), but Gradle/AGP still resolve compileSdk by the plain
      # "android-<N>" hash. Symlink so compileSdk 37 (required by
      # flutter_secure_storage) resolves. Safe to drop once AGP/Android SDK
      # tooling reconcile this naming change upstream.
      - name: Work around Android SDK platform naming
        run: |
          sdkmanager "platforms;android-37.0"
          platform_dir="$ANDROID_HOME/platforms"
          if [ -d "$platform_dir/android-37.0" ] && [ ! -e "$platform_dir/android-37" ]; then
            ln -s "$platform_dir/android-37.0" "$platform_dir/android-37"
          fi

      # Release signing is intentionally not set up here — it needs a
      # keystore secret the app owner must generate and add later.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
