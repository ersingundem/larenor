name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-test:
    uses: ./.github/workflows/analyze-test.yml

  end-to-end:
    uses: ./.github/workflows/android-e2e.yml

  server-test:
    uses: ./.github/workflows/server-test.yml

  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide Android and Flutter scope from the exact PR diff
        id: android_scope
        run: python3 tool/android_ci_scope.py

      - name: Android/Flutter checks reused
        if: steps.android_scope.outputs.run == 'false'
        run: |
          echo 'Android/Flutter checks reused: this exact PR diff changes only Server or documentation files.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: steps.android_scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        if: steps.android_scope.outputs.run == 'true'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.android_scope.outputs.run == 'true'
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - run: flutter pub get --enforce-lockfile
        if: steps.android_scope.outputs.run == 'true'

      - run: dart run build_runner build
        if: steps.android_scope.outputs.run == 'true'

      # Android's SDK now ships fractional platform revisions (e.g.
      # android-37.0), but Gradle/AGP still resolve compileSdk by the plain
      # "android-<N>" hash. Symlink so compileSdk 37 (required by
      # flutter_secure_storage) resolves. Safe to drop once AGP/Android SDK
      # tooling reconcile this naming change upstream.
      - name: Work around Android SDK platform naming
        if: steps.android_scope.outputs.run == 'true'
        run: |
          sdkmanager "platforms;android-37.0"
          platform_dir="$ANDROID_HOME/platforms"
          if [ -d "$platform_dir/android-37.0" ] && [ ! -e "$platform_dir/android-37" ]; then
            ln -s "$platform_dir/android-37.0" "$platform_dir/android-37"
          fi

      - name: Build debug APK with a monotonic CI versionCode
        if: steps.android_scope.outputs.run == 'true'
        run: flutter build apk --debug --build-number "$(python3 tool/android_signing.py version-code)"

      - name: Native audio, kiosk, window, health privacy and platform contracts
        if: steps.android_scope.outputs.run == 'true'
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Preserve native test evidence
        id: test_evidence
        if: always() && steps.android_scope.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-native-test-evidence
          path: |
            build/app/reports/tests/testDebugUnitTest/
            build/app/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report unavailable native test artifact
        if: always() && steps.android_scope.outputs.run == 'true' && steps.test_evidence.outcome == 'failure'
        run: |
          echo "::warning::Native test artifact upload failed. Test results remain in this job's logs; test failures still block delivery."
          echo 'Native test artifact upload was unavailable. Inspect the native test step logs for results.' >> "$GITHUB_STEP_SUMMARY"

      - name: Release signing must fail closed without private keys
        if: steps.android_scope.outputs.run == 'true'
        working-directory: android
        run: |
          ./gradlew :app:preReleaseBuild --dry-run > release-task-graph.log 2>&1
          grep -F ':app:validateReleaseSigning' release-task-graph.log
          if ./gradlew :app:validateReleaseSigning > release-signing-check.log 2>&1; then
            echo "Release signing unexpectedly accepted missing keys."
            exit 1
          fi
          grep -F "Release signing is not configured" release-signing-check.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Main pushes publish the verified signed APK below. Keep large debug
        # downloads for explicit manual runs and PR troubleshooting only.
        if: steps.android_scope.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3


  # Signing secrets never enter pull-request builds or manually selected branches.
  build-signed-release-apk:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build-debug-apk, analyze-test, end-to-end, server-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      # Pin the verifier output contract; do not select a runner's newest preview.
      ANDROID_BUILD_TOOLS_VERSION: "37.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release signing availability
        id: signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: python3 tool/android_signing.py check-ci

      - name: Require the configured beta signing identity
        if: steps.signing.outputs.available != 'true'
        run: |
          echo "A merged main commit must produce a signed beta Client release. Configure the five Android release signing secrets."
          exit 1

      - name: Require one attempt for each beta version
        if: steps.signing.outputs.available == 'true'
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "For a signed rebuild, dispatch a new main run to allocate a fresh versionCode."
            exit 1
          fi

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: steps.signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        if: steps.signing.outputs.available == 'true'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.signing.outputs.available == 'true'
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Prepare build dependencies
        if: steps.signing.outputs.available == 'true'
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;$ANDROID_BUILD_TOOLS_VERSION"
          platform_dir="$ANDROID_HOME/platforms"
          if [ -d "$platform_dir/android-37.0" ] && [ ! -e "$platform_dir/android-37" ]; then
            ln -s "$platform_dir/android-37.0" "$platform_dir/android-37"
          fi

      - name: Materialize and verify the private signing identity
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: python3 tool/android_signing.py prepare-ci

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: flutter build apk --release --build-number "$(python3 tool/android_signing.py version-code)"

      - name: Verify APK signature, package and version
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          python3 tool/android_signing.py verify-apk \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --metadata build/app/outputs/flutter-apk/release-metadata.json

      - name: Remove private signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -rf "$RUNNER_TEMP/larenor-signing"

      - name: Build the public beta source manifest
        if: success() && steps.signing.outputs.available == 'true'
        id: beta
        run: |
          version_code=$(python3 tool/android_signing.py version-code)
          apk_name="Larenor-Client-beta-$version_code.apk"
          manifest_name="Larenor-Client-beta-$version_code.json"
          install -d -m 0700 "$RUNNER_TEMP/larenor-beta"
          install -m 0600 build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/larenor-beta/$apk_name"
          python3 tool/beta_release.py manifest \
            --metadata build/app/outputs/flutter-apk/release-metadata.json \
            --apk "$RUNNER_TEMP/larenor-beta/$apk_name" \
            --output "$RUNNER_TEMP/larenor-beta/$manifest_name" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/android-build.yml \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --published-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Publish and verify the signed content-bound beta release
        if: success() && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.beta.outputs.releaseTag }}
          APK_ASSET: ${{ steps.beta.outputs.apkAssetName }}
          MANIFEST_ASSET: ${{ steps.beta.outputs.manifestAssetName }}
          VERSION_CODE: ${{ steps.beta.outputs.versionCode }}
        run: |
          require_absent() {
            endpoint=$1
            evidence=$2
            set +e
            gh api --include "$endpoint" > "$evidence" 2>/dev/null
            probe_result=$?
            set -e
            if [ "$probe_result" -eq 0 ] || ! head -n 1 "$evidence" | grep -Eq '^HTTP/[0-9.]+ 404 ' ; then
              echo "Beta carrier absence could not be proven."
              return 1
            fi
          }
          require_absent "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" "$RUNNER_TEMP/beta-release-preflight"
          require_absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" "$RUNNER_TEMP/beta-tag-preflight"
          cleanup_pending=true
          cleanup_beta() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ] && [ "$cleanup_pending" = "true" ]; then
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/beta-cleanup-release.json" && \
                  cleanup_tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq 'select(.object.type == "commit") | .object.sha') && \
                  cleanup_id=$(python3 tool/beta_release.py verify-candidate \
                    --release "$RUNNER_TEMP/beta-cleanup-release.json" \
                    --id "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/beta-cleanup-release.json")" \
                    --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" \
                    --tag-commit "$cleanup_tag_commit" --allow-draft); then
                if gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$cleanup_id" && \
                    cleanup_current_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq 'select(.object.type == "commit") | .object.sha') && \
                    [ "$cleanup_current_commit" = "$GITHUB_SHA" ] && \
                    gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" && \
                    require_absent "repos/$GITHUB_REPOSITORY/releases/$cleanup_id" "$RUNNER_TEMP/beta-cleanup-release-absence" && \
                    require_absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" "$RUNNER_TEMP/beta-cleanup-tag-absence"; then
                  echo "Removed the exact failed mutable beta carrier $cleanup_id."
                else
                  echo "The failed beta carrier cleanup outcome could not be proven."
                fi
              else
                echo "The failed beta carrier was ambiguous; leaving it for explicit review."
              fi
            fi
            exit "$result"
          }
          trap cleanup_beta EXIT
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Larenor Client beta $VERSION_CODE" \
            --notes "Signed Android beta for source commit $GITHUB_SHA. Install through an authenticated Larenor Core." \
            --prerelease --latest=false --draft \
            "$RUNNER_TEMP/larenor-beta/$APK_ASSET" \
            "$RUNNER_TEMP/larenor-beta/$MANIFEST_ASSET"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/beta-release.json"
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq 'select(.object.type == "commit") | .object.sha')
          python3 tool/beta_release.py verify-release \
            --release "$RUNNER_TEMP/beta-release.json" \
            --manifest "$RUNNER_TEMP/larenor-beta/$MANIFEST_ASSET" \
            --apk "$RUNNER_TEMP/larenor-beta/$APK_ASSET" \
            --tag-commit "$tag_commit"
          cleanup_pending=false

      - name: Apply bounded beta release retention
        if: success() && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/beta-releases.json"
          python3 tool/beta_release.py retention \
            --releases "$RUNNER_TEMP/beta-releases.json" \
            --keep 8 --max-deletions 4 > "$RUNNER_TEMP/beta-retirements"
          require_absent() {
            endpoint=$1
            evidence=$2
            set +e
            gh api --include "$endpoint" > "$evidence" 2>/dev/null
            result=$?
            set -e
            if [ "$result" -eq 0 ] || ! head -n 1 "$evidence" | grep -Eq '^HTTP/[0-9.]+ 404 ' ; then
              echo "Deletion outcome could not be proven."
              return 1
            fi
          }
          while IFS=' ' read -r release_id release_tag release_commit; do
            if [ -n "$release_id" ]; then
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/beta-retirement.json"
              tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq 'select(.object.type == "commit") | .object.sha')
              python3 tool/beta_release.py verify-candidate \
                --release "$RUNNER_TEMP/beta-retirement.json" --id "$release_id" \
                --tag "$release_tag" --commit "$release_commit" --tag-commit "$tag_commit"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
              current_tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq 'select(.object.type == "commit") | .object.sha')
              if [ "$current_tag_commit" != "$release_commit" ]; then
                echo "The beta tag changed after release deletion; refusing to delete it."
                exit 1
              fi
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$release_tag"
              require_absent "repos/$GITHUB_REPOSITORY/releases/$release_id" "$RUNNER_TEMP/beta-release-absence"
              require_absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" "$RUNNER_TEMP/beta-tag-absence"
              echo "Retired old verified beta release and tag $release_tag."
            fi
          done < "$RUNNER_TEMP/beta-retirements"

      - name: Publish verified Client to the configured Larenor Server
        if: success() && steps.signing.outputs.available == 'true' && vars.LARENOR_RELEASE_SERVER_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LARENOR_RELEASE_SERVER_URL: ${{ vars.LARENOR_RELEASE_SERVER_URL }}
          LARENOR_RELEASE_PUBLISH_TOKEN: ${{ secrets.LARENOR_RELEASE_PUBLISH_TOKEN }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Skipping direct Server publication for an older main commit; Core will pull its verified beta carrier."
            exit 0
          fi
          unset GH_TOKEN
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          endpoint = urlsplit(os.environ['LARENOR_RELEASE_SERVER_URL'])
          if endpoint.scheme != 'https' or not endpoint.hostname:
              raise SystemExit('CI publishing requires a configured HTTPS Server endpoint.')
          PY
          python3 tool/publish_client_release.py \
            --server "$LARENOR_RELEASE_SERVER_URL" \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --metadata build/app/outputs/flutter-apk/release-metadata.json

      - name: Upload verified signed APK and public integrity metadata
        if: success() && steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-signed-release-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/release-metadata.json
          if-no-files-found: error
          retention-days: 30
