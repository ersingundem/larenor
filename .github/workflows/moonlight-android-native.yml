{
  "name": "Moonlight Android Native Package",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/moonlight-android-native.yml",
        "android/moonlight/**",
        "android/app/build.gradle.kts",
        "android/app/src/main/AndroidManifest.xml",
        "android/app/src/main/kotlin/com/ersingundem/larenor/MainActivity.kt",
        "android/app/src/main/kotlin/com/ersingundem/larenor/game/**",
        "android/app/src/test/kotlin/com/ersingundem/larenor/game/**",
        "android/app/src/moonlight/**",
        "android/app/src/moonlightTest/**",
        "lib/features/game_streaming/**",
        "test/features/game_streaming/**",
        "tool/moonlight_android_package.py",
        "tool/tests/moonlight_android_package_test.py",
        "tool/android_acceptance_gradle.py"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "moonlight-android-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "package": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "GIT_TERMINAL_PROMPT": "0",
        "PR_HEAD_REPOSITORY": "${{ github.event.pull_request.head.repo.full_name }}"
      },
      "steps": [
        {
          "name": "Require reviewed GitHub-hosted execution",
          "run": "case \"$GITHUB_EVENT_NAME\" in\n  workflow_dispatch) case \"$GITHUB_REF\" in refs/heads/main|refs/heads/codex/project-completion-100) ;; *) exit 1;; esac; test -z \"$PR_HEAD_REPOSITORY\";;\n  pull_request) test \"$GITHUB_BASE_REF\" = main; test \"$PR_HEAD_REPOSITORY\" = \"$GITHUB_REPOSITORY\"; case \"$GITHUB_REF\" in refs/pull/*/merge) ;; *) exit 1;; esac;;\n  *) exit 1;;\nesac\ntest \"$GITHUB_REPOSITORY\" = ersingundem/larenor\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$RUNNER_ENVIRONMENT\" = github-hosted\n"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd",
          "with": {
            "packages": "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865"
          }
        },
        {
          "name": "Verify the pinned recursive source and packaging policy",
          "run": "set -euo pipefail\npython3 tool/moonlight_android_package.py verify-lock\npython3 -m unittest tool.tests.moonlight_android_package_test\ngit clone --no-checkout https://github.com/moonlight-stream/moonlight-android.git \"$RUNNER_TEMP/moonlight-source\"\ngit -C \"$RUNNER_TEMP/moonlight-source\" checkout --detach b48494cb96bff23d8886c4775cc4f39a1075495d\ngit -C \"$RUNNER_TEMP/moonlight-source\" submodule update --init --recursive\npython3 tool/moonlight_android_package.py verify-source \"$RUNNER_TEMP/moonlight-source\"\n"
        },
        {
          "name": "Build and receipt the actual two-ABI embedded engine",
          "env": {
            "GRADLE_USER_HOME": "${{ runner.temp }}/moonlight-engine-gradle"
          },
          "run": "set -euo pipefail\nmkdir \"$RUNNER_TEMP/moonlight-package\"\npython3 tool/moonlight_android_package.py build \"$RUNNER_TEMP/moonlight-source\" \"$RUNNER_TEMP/moonlight-build\" \"$RUNNER_TEMP/moonlight-package/moonlight-engine.aar\" \"$RUNNER_TEMP/moonlight-package/receipt.json\"\npython3 tool/moonlight_android_package.py verify-install \"$RUNNER_TEMP/moonlight-package/moonlight-engine.aar\" \"$RUNNER_TEMP/moonlight-package/receipt.json\"\npython3 tool/moonlight_android_package.py source-bundle \"$RUNNER_TEMP/moonlight-source\" \"$RUNNER_TEMP/moonlight-package/source.tar.gz\"\n"
        },
        {
          "uses": "subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2",
          "with": {
            "flutter-version": "3.47.2",
            "channel": "stable",
            "cache": true
          }
        },
        {
          "name": "Compile the receipted engine into Larenor and verify the real APK",
          "env": {
            "GRADLE_USER_HOME": "${{ runner.temp }}/moonlight-app-gradle-cache"
          },
          "run": "set -euo pipefail\nmkdir -p android/app/moonlight\ncp \"$RUNNER_TEMP/moonlight-package/moonlight-engine.aar\" android/app/moonlight/moonlight-engine.aar\ncp \"$RUNNER_TEMP/moonlight-package/receipt.json\" android/app/moonlight/receipt.json\nflutter pub get\ndart run build_runner build --delete-conflicting-outputs\nflutter build apk --debug --target-platform android-arm64,android-x64\npython3 tool/moonlight_android_package.py verify-apk build/app/outputs/flutter-apk/app-debug.apk android/app/moonlight/receipt.json\n"
        },
        {
          "name": "Check embedded authority and exact lifecycle regressions",
          "env": {
            "GRADLE_USER_HOME": "${{ runner.temp }}/moonlight-app-gradle-cache"
          },
          "run": "set -euo pipefail\npython3 - <<'GATE'\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport xml.etree.ElementTree as ET\nfrom tool.android_acceptance_gradle import materialized_gradle_command\nroot = Path.cwd().resolve()\nlauncher = Path(os.environ['RUNNER_TEMP']).resolve() / 'moonlight-app-gradle'\nclasses = (\n    'com.ersingundem.larenor.game.GameStreamNativeBridgeTest',\n    'com.ersingundem.larenor.game.GameStreamNativeAdapterTest',\n    'com.ersingundem.larenor.game.moonlight.MoonlightEmbeddedRuntimeTest',\n)\ncommand = materialized_gradle_command(launcher, project_android=root / 'android')\nselectors = [argument for name in classes for argument in ('--tests', name)]\nsubprocess.run(command + ['--no-daemon', ':app:testDebugUnitTest'] + selectors, cwd=root / 'android', check=True, timeout=1200)\nreports = []\nfor name in classes:\n    report = root / 'build/app/test-results/testDebugUnitTest' / f'TEST-{name}.xml'\n    suite = ET.parse(report).getroot()\n    counts = {key: int(suite.attrib[key]) for key in ('tests', 'failures', 'errors', 'skipped')}\n    if suite.attrib['name'] != name or counts['tests'] < 1 or any(counts[key] for key in ('failures', 'errors', 'skipped')):\n        raise RuntimeError('embedded_lifecycle_gate_failed')\n    reports.append({'className': name, **counts})\nrevision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()\nif revision != os.environ['GITHUB_SHA']:\n    raise RuntimeError('source_revision_mismatch')\npackage = Path(os.environ['RUNNER_TEMP']).resolve() / 'moonlight-package'\nreceipt = {\n    'schemaVersion': 1,\n    'gate': 'packaged_lifecycle_regressions',\n    'sourceRevision': revision,\n    'packageReceiptSha256': hashlib.sha256((package / 'receipt.json').read_bytes()).hexdigest(),\n    'tests': reports,\n}\n(package / 'native-lifecycle-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\\n')\nGATE\n"
        },
        {
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "moonlight-12.2-${{ github.sha }}-package",
            "path": "${{ runner.temp }}/moonlight-package/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
