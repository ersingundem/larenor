name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Preserve the blocking scan and redacted job summary without using
          # artifact storage (supported by this exact action revision).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_COMMENTS: "false"

  platform-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate backup and CI security policies
        run: python3 -m unittest discover -s tool/tests -p '*_test.py' -v
      - run: python3 tool/check_security_policy.py

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan locked dependencies
        id: osv
        # The reusable workflow always uploads an artifact. Its scanner-action
        # wrapper also masks exit 128; invoke the official CLI directly so every
        # scan error and vulnerability stays blocking. Evidence remains in logs.
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock
          test -s server/uv.lock
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --workdir /src \
            ghcr.io/google/osv-scanner:v2.5.0@sha256:5b8b38e45bb2c5c4976f0f1f07860551ea6e1f235f642cf215f74d266fec2c1b \
            scan source --format=table \
            --lockfile=./pubspec.lock \
            --lockfile=./server/uv.lock
      - name: Summarize dependency scan
        if: ${{ always() }}
        env:
          SCAN_OUTCOME: ${{ steps.osv.outcome }}
        run: |
          {
            echo '### Dependency scan'
            printf 'OSV result: **%s**.\n\n' "$SCAN_OUTCOME"
            echo 'Required inputs: pubspec.lock and server/uv.lock.'
            echo 'Full findings and scan errors are in the **Scan locked dependencies** log; no artifact upload is required.'
          } >> "$GITHUB_STEP_SUMMARY"
