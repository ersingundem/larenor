name: Server API & Storage Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  f08-linux-cgroup:
    name: f08-linux-cgroup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated pinned Python tooling
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/larenor-f08-venv" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/larenor-f08-python" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/larenor-f08-tools"
          "$RUNNER_TEMP/larenor-f08-tools/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: uv==0.12.10
          echo "$RUNNER_TEMP/larenor-f08-tools/bin" >> "$GITHUB_PATH"

      - name: Install the reviewed Server dependency lock
        working-directory: server
        run: uv sync --locked --python 3.12.14

      - name: Prepare the dedicated unprivileged AI user manager
        run: |
          set -x
          sudo groupadd --gid 10001 larenor-core
          sudo useradd --uid 10001 --gid 10001 --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin larenor-core
          sudo groupadd --gid 10002 larenor-ipc
          sudo groupadd --gid 10003 larenor-ai
          sudo useradd --uid 10003 --gid 10003 --groups 10002 --create-home --home-dir /var/lib/larenor-ai --shell /usr/sbin/nologin larenor-ai
          sudo loginctl enable-linger larenor-ai
          sudo systemctl start user-runtime-dir@10003.service
          sudo systemctl start --no-block user@10003.service
          for attempt in $(seq 1 30); do
            if sudo systemctl is-active --quiet user@10003.service && sudo test -S /run/user/10003/bus; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo systemctl --no-pager --full status user-runtime-dir@10003.service user@10003.service || true
              sudo journalctl --no-pager --unit=user-runtime-dir@10003.service --unit=user@10003.service --lines=100 || true
              exit 1
            fi
            sleep 1
          done
          chmod -R a+rX "$UV_PROJECT_ENVIRONMENT"
          chmod -R a+rX "$UV_PYTHON_INSTALL_DIR"

      - name: Prove Core UID IPC to the actual user-manager cgroup runtime
        working-directory: server
        env:
          LARENOR_F08_SYSTEMD_ACCEPTANCE: "1"
        run: |
          sudo --preserve-env=LARENOR_F08_SYSTEMD_ACCEPTANCE \
            "$UV_PROJECT_ENVIRONMENT/bin/python" -m pytest -q \
            tests/test_f08_ai_worker_ipc.py::test_actual_uid10003_user_manager_runs_through_uid10001_ipc

  server-test-shard:
    name: server-test-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    # Each shard has its own runner, checkout, virtualenv and pytest temp root.
    # Measured shard runs can spend over a minute in pinned toolchain setup.
    # Keep a bounded margin beyond the balanced pytest runtime.
    timeout-minutes: 30
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide Server scope from the exact PR diff
        id: server_scope
        run: python3 tool/server_ci_scope.py

      - name: Server tests reused
        if: steps.server_scope.outputs.run == 'false'
        run: |
          echo 'Server tests reused: this exact PR diff changes only Flutter, Android UI, or documentation files.' >> "$GITHUB_STEP_SUMMARY"

      - name: Select isolated Server test paths
        if: steps.server_scope.outputs.run == 'true'
        run: |
          {
            echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/larenor-server-venv"
            echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/larenor-test-python"
            echo "LARENOR_TEST_APKSIG_JAR=$RUNNER_TEMP/larenor-verifier/apksig.jar"
          } >> "$GITHUB_ENV"

      - name: Prepare APK signature verifier toolchain
        if: steps.server_scope.outputs.run == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch and verify the pinned Android APK signature library
        if: steps.server_scope.outputs.run == 'true'
        run: |
          mkdir -p "$(dirname "$LARENOR_TEST_APKSIG_JAR")"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 --max-time 60 \
            'https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/9.1.0/apksig-9.1.0.jar' \
            --output "$LARENOR_TEST_APKSIG_JAR"
          printf '%s  %s\n' '562cd0a88890960d2ece48e116c61f12872222f1dcc306890799382bc019b201' "$LARENOR_TEST_APKSIG_JAR" | sha256sum --check --strict

      - name: Prepare isolated pinned Python tooling
        if: steps.server_scope.outputs.run == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/larenor-ci-tools"
          "$RUNNER_TEMP/larenor-ci-tools/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: uv==0.12.10
          echo "$RUNNER_TEMP/larenor-ci-tools/bin" >> "$GITHUB_PATH"

      - name: Install the reviewed Server dependency lock
        if: steps.server_scope.outputs.run == 'true'
        working-directory: server
        run: uv sync --locked --python 3.12.14

      - name: Check installed dependency consistency
        if: steps.server_scope.outputs.run == 'true'
        run: uv pip check --python "$UV_PROJECT_ENVIRONMENT/bin/python"

      - name: Exercise authentication, authorization, encrypted storage and API contracts
        if: steps.server_scope.outputs.run == 'true'
        working-directory: server
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          shard_dir="$RUNNER_TEMP/larenor-server-shards"
          python ../tool/server_test_shards.py --root tests --count 4 \
            --weights ../tool/server_test_durations.json --output-dir "$shard_dir"
          shard="${{ matrix.shard }}"
          mapfile -t test_paths < "$shard_dir/$shard.txt"
          uv run --locked --no-sync python -m pytest \
            --basetemp="$RUNNER_TEMP/larenor-pytest-$shard" \
            --junitxml="$GITHUB_WORKSPACE/test-results/larenor-server-$shard.xml" \
            -- "${test_paths[@]}"

      - name: Preserve synthetic test evidence
        id: test_evidence
        if: always() && steps.server_scope.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: larenor-server-test-evidence-${{ matrix.shard }}
          path: test-results/larenor-server-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Report unavailable Server test artifact
        if: always() && steps.server_scope.outputs.run == 'true' && steps.test_evidence.outcome == 'failure'
        run: |
          echo "::warning::Server test artifact upload failed. Test results remain in this job's logs; test failures still block delivery."
          echo 'Server test artifact upload was unavailable. Inspect the Server test step logs for results.' >> "$GITHUB_STEP_SUMMARY"

  # Preserve the required branch-protection check name while all isolated
  # shards remain visible as independent evidence.
  server-test:
    name: server-test
    if: always()
    needs: [server-test-shard, f08-linux-cgroup]
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every deterministic Server shard
        env:
          SHARD_RESULT: ${{ needs.server-test-shard.result }}
          F08_CGROUP_RESULT: ${{ needs.f08-linux-cgroup.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tool/required_ci_aggregate.py server
          if [ "$F08_CGROUP_RESULT" != "success" ]; then
            echo "F08 Linux cgroup gate did not pass: $F08_CGROUP_RESULT"
            exit 1
          fi
