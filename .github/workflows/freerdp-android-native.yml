{
  "name": "FreeRDP Android Native Package",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/freerdp-android-native.yml",
        "android/freerdp-native.lock.json",
        "android/freerdp-certificate-pem.patch",
        "android/app/build.gradle.kts",
        "android/app/src/freerdp/**",
        "android/app/src/main/kotlin/com/ersingundem/larenor/rdp/**",
        "android/app/src/test/kotlin/com/ersingundem/larenor/rdp/**",
        "lib/features/remote_access/rdp/**",
        "test/features/remote_access/rdp/**",
        "tool/freerdp_android_package.py",
        "tool/tests/freerdp_android_package_test.py",
        "android/app/src/freerdpAndroidTest/**",
        "tool/f62_packaged_acceptance.py",
        "tool/tests/f62_packaged_acceptance_test.py",
        "tool/tests/freerdp_android_workflow_test.py",
        "tool/android_acceptance_gradle.py",
        "tool/native_acceptance_receipt.py",
        "android/freerdp-clipboard-utf8.patch",
        "tool/f62_owned_shadow_channels.py",
        "tool/patches/f62-owned-shadow-channels.patch",
        "tool/tests/f62_owned_shadow_channels_test.py",
        "android/freerdp-display-pointer-v2.patch",
        "android/freerdp-remote-audio-v3.patch",
        "tool/patches/f62-owned-shadow-audio.patch",
        "android/freerdp-always-pin-v4.patch",
        "android/freerdp-microphone-v4.patch",
        "tool/f62_owned_microphone.py",
        "tool/patches/f62-owned-shadow-microphone.patch",
        "tool/tests/f62_owned_microphone_test.py",
        "contracts/rdp-client.v4.json"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "freerdp-android-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "package": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "abi": [
            "arm64-v8a",
            "x86_64"
          ]
        }
      },
      "env": {
        "ABI": "${{ matrix.abi }}",
        "PR_HEAD_REPOSITORY": "${{ github.event.pull_request.head.repo.full_name }}"
      },
      "steps": [
        {
          "name": "Require reviewed GitHub-hosted execution",
          "run": "case \"$GITHUB_EVENT_NAME\" in\n  workflow_dispatch) case \"$GITHUB_REF\" in refs/heads/main|refs/heads/codex/project-completion-100) ;; *) exit 1;; esac; test -z \"$PR_HEAD_REPOSITORY\";;\n  pull_request) test \"$GITHUB_BASE_REF\" = main; test \"$PR_HEAD_REPOSITORY\" = \"$GITHUB_REPOSITORY\"; case \"$GITHUB_REF\" in refs/pull/*/merge) ;; *) exit 1;; esac;;\n  *) exit 1;;\nesac\ntest \"$GITHUB_REPOSITORY\" = ersingundem/larenor\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$RUNNER_ENVIRONMENT\" = github-hosted\n"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd",
          "with": {
            "packages": "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.13113456 cmake;4.1.2"
          }
        },
        {
          "name": "Verify immutable source and reviewed JNI surface",
          "run": "set -euo pipefail\npython3 tool/freerdp_android_package.py verify-lock\narchive=\"$RUNNER_TEMP/freerdp-3.31.1.tar.gz\"\ncurl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output \"$archive\" https://github.com/FreeRDP/FreeRDP/releases/download/3.31.1/freerdp-3.31.1.tar.gz\npython3 tool/freerdp_android_package.py verify-source \"$archive\"\nmkdir \"$RUNNER_TEMP/freerdp-source\"\ntar --extract --gzip --file \"$archive\" --directory \"$RUNNER_TEMP/freerdp-source\" --strip-components=1 --no-same-owner\n"
        },
        {
          "name": "Apply reviewed SPKI and standard Unicode JNI patches",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/freerdp-source\"\ngit apply --check \"$GITHUB_WORKSPACE/android/freerdp-certificate-pem.patch\"\ngit apply \"$GITHUB_WORKSPACE/android/freerdp-certificate-pem.patch\"\ngit apply --check \"$GITHUB_WORKSPACE/android/freerdp-clipboard-utf8.patch\"\ngit apply \"$GITHUB_WORKSPACE/android/freerdp-clipboard-utf8.patch\"\ngit apply --check \"$GITHUB_WORKSPACE/android/freerdp-display-pointer-v2.patch\"\ngit apply \"$GITHUB_WORKSPACE/android/freerdp-display-pointer-v2.patch\"\ngit apply --check \"$GITHUB_WORKSPACE/android/freerdp-remote-audio-v3.patch\"\ngit apply \"$GITHUB_WORKSPACE/android/freerdp-remote-audio-v3.patch\"\ngit apply --check \"$GITHUB_WORKSPACE/android/freerdp-always-pin-v4.patch\"\ngit apply \"$GITHUB_WORKSPACE/android/freerdp-always-pin-v4.patch\"\ngit apply --check \"$GITHUB_WORKSPACE/android/freerdp-microphone-v4.patch\"\ngit apply \"$GITHUB_WORKSPACE/android/freerdp-microphone-v4.patch\"\npython3 \"$GITHUB_WORKSPACE/tool/freerdp_android_package.py\" verify-patch .\ncat > client/Android/Studio/freeRDPCore/src/main/AndroidManifest.xml <<'EOF'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" />\nEOF\n"
        },
        {
          "name": "Preflight an owned resizable Xorg display",
          "if": "matrix.abi == 'x86_64'",
          "run": "set -euo pipefail\nsudo apt-get update -qq\ncandidate() {\n  apt-cache policy \"$1\" | awk '$1 == \"Candidate:\" {print $2}'\n}\nwinpr_version=\"$(candidate winpr3-utils)\"\nxinput_version=\"$(candidate xinput)\"\nxorg_core_version=\"$(candidate xserver-xorg-core)\"\nxorg_dummy_version=\"$(candidate xserver-xorg-video-dummy)\"\nx11_apps_version=\"$(candidate x11-apps)\"\nx11_utils_version=\"$(candidate x11-utils)\"\nx11_xserver_utils_version=\"$(candidate x11-xserver-utils)\"\nfor version in   \"$winpr_version\" \"$xinput_version\"   \"$xorg_core_version\" \"$xorg_dummy_version\"   \"$x11_apps_version\" \"$x11_utils_version\" \"$x11_xserver_utils_version\"; do\n  case \"$version\" in \"\"|\"(none)\") exit 1;; esac\ndone\nsudo apt-get install -y --no-install-recommends    \"winpr3-utils=$winpr_version\"   \"xinput=$xinput_version\"   \"xserver-xorg-core=$xorg_core_version\"   \"xserver-xorg-video-dummy=$xorg_dummy_version\"   \"x11-apps=$x11_apps_version\"   \"x11-utils=$x11_utils_version\"   \"x11-xserver-utils=$x11_xserver_utils_version\"\ntest \"$(dpkg-query -W -f='${Version}' winpr3-utils)\" = \"$winpr_version\"\ntest \"$(dpkg-query -W -f='${Version}' xinput)\" = \"$xinput_version\"\ntest \"$(dpkg-query -W -f='${Version}' xserver-xorg-core)\" = \"$xorg_core_version\"\ntest \"$(dpkg-query -W -f='${Version}' xserver-xorg-video-dummy)\" = \"$xorg_dummy_version\"\ntest \"$(dpkg-query -W -f='${Version}' x11-apps)\" = \"$x11_apps_version\"\ntest \"$(dpkg-query -W -f='${Version}' x11-utils)\" = \"$x11_utils_version\"\ntest \"$(dpkg-query -W -f='${Version}' x11-xserver-utils)\" = \"$x11_xserver_utils_version\"\n{\n  echo \"RDP_ACCEPTANCE_WINPR_PACKAGE_VERSION=$winpr_version\"\n  echo \"RDP_ACCEPTANCE_XINPUT_PACKAGE_VERSION=$xinput_version\"\n  echo \"RDP_ACCEPTANCE_XORG_CORE_PACKAGE_VERSION=$xorg_core_version\"\n  echo \"RDP_ACCEPTANCE_XORG_DUMMY_PACKAGE_VERSION=$xorg_dummy_version\"\n} >> \"$GITHUB_ENV\"\nmkdir -p \"$RUNNER_TEMP/freerdp-package/acceptance\"\nxorg_config=\"$RUNNER_TEMP/freerdp-package/acceptance/xorg-dummy.conf\"\ncat > \"$xorg_config\" <<'EOF'\nSection \"ServerFlags\"\n  Option \"AutoAddDevices\" \"false\"\nEndSection\nSection \"Device\"\n  Identifier \"LarenorDummyDevice\"\n  Driver \"dummy\"\n  VideoRam 256000\nEndSection\nSection \"Monitor\"\n  Identifier \"LarenorDummyMonitor\"\n  HorizSync 5.0-1000.0\n  VertRefresh 5.0-200.0\n  Modeline \"1280x800\" 83.50 1280 1352 1480 1680 800 803 809 831 -HSync +VSync\n  Modeline \"1024x768\" 65.00 1024 1048 1184 1344 768 771 777 806 -HSync -VSync\nEndSection\nSection \"Screen\"\n  Identifier \"LarenorDummyScreen\"\n  Device \"LarenorDummyDevice\"\n  Monitor \"LarenorDummyMonitor\"\n  DefaultDepth 24\n  SubSection \"Display\"\n    Depth 24\n    Modes \"1280x800\" \"1024x768\"\n    Virtual 1280 800\n  EndSubSection\nEndSection\nSection \"ServerLayout\"\n  Identifier \"LarenorDummyLayout\"\n  Screen 0 \"LarenorDummyScreen\"\nEndSection\nEOF\nenv -u RUNNER_TRACKING_ID nohup /usr/lib/xorg/Xorg :99   -noreset -nolisten tcp -ac -config \"$xorg_config\"   -logfile \"$RUNNER_TEMP/freerdp-package/acceptance/xorg.log\"   > \"$RUNNER_TEMP/freerdp-package/acceptance/xorg-launch.log\" 2>&1 &\necho $! > \"$RUNNER_TEMP/xorg.pid\"\nfor _ in $(seq 1 30); do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break; sleep 1; done\ntest \"$(DISPLAY=:99 xdpyinfo | awk '$1 == \"dimensions:\" {print $2}')\" = 1280x800\nmapfile -t active_outputs < <(\n  DISPLAY=:99 xrandr --query |\n    awk '$2 == \"connected\" && $0 ~ /[0-9]+x[0-9]+\\+[0-9]+\\+[0-9]+/ {print $1}'\n)\ntest \"${#active_outputs[@]}\" -eq 1\noutput=\"${active_outputs[0]}\"\ncase \"$output\" in\n  \"\"|*[!A-Za-z0-9_.:-]*) exit 1;;\nesac\nDISPLAY=:99 xrandr --output \"$output\" --mode 1024x768 --fb 1024x768\ntest \"$(DISPLAY=:99 xdpyinfo | awk '$1 == \"dimensions:\" {print $2}')\" = 1024x768\ntest \"$(DISPLAY=:99 xrandr --query | awk -v output=\"$output\" \\\n  '$1 == output && $2 == \"connected\" && $0 ~ /1024x768\\+0\\+0/ {count++} END {print count+0}')\" -eq 1\nDISPLAY=:99 xrandr --fb 1280x800 --output \"$output\" --mode 1280x800\ntest \"$(DISPLAY=:99 xdpyinfo | awk '$1 == \"dimensions:\" {print $2}')\" = 1280x800\ntest \"$(DISPLAY=:99 xrandr --query | awk -v output=\"$output\"   '$1 == output && $2 == \"connected\" && $0 ~ /1280x800\\+0\\+0/ {count++} END {print count+0}')\" -eq 1\necho \"RDP_ACCEPTANCE_XORG_OUTPUT=$output\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "name": "Build exact owned FreeRDP channel fixture",
          "if": "matrix.abi == 'x86_64'",
          "run": "set -euo pipefail\numask 077\nmkdir -m 0700 \"$RUNNER_TEMP/freerdp-public-owned-fixture\"\nbuild_packages=(build-essential pkg-config libssl-dev zlib1g-dev libcjson-dev libx11-dev libxext-dev libxinerama-dev libxdamage-dev libxfixes-dev libxtst-dev libxi-dev libxkbfile-dev)\nbuild_versions=()\ninstall_arguments=()\nfor package in \"${build_packages[@]}\"; do\n  version=\"$(apt-cache policy \"$package\" | awk '$1 == \"Candidate:\" {print $2}')\"\n  [[ \"$version\" =~ ^[A-Za-z0-9.+:~_-]+$ ]] || exit 1\n  build_versions+=(\"$version\")\n  install_arguments+=(\"$package=$version\")\ndone\nsudo apt-get install --yes --no-install-recommends \"${install_arguments[@]}\"\nfor index in \"${!build_packages[@]}\"; do\n  test \"$(dpkg-query -W -f='${Version}' \"${build_packages[$index]}\")\" = \"${build_versions[$index]}\"\ndone\npython3 tool/f62_owned_shadow_channels.py prepare \"$RUNNER_TEMP/freerdp-3.31.1.tar.gz\" \"$RUNNER_TEMP/f62-owned-shadow-source\"\npython3 tool/f62_owned_shadow_channels.py build \"$RUNNER_TEMP/f62-owned-shadow-source\" \"$RUNNER_TEMP/f62-owned-shadow-build\" --cmake \"$ANDROID_HOME/cmake/4.1.2/bin/cmake\" --log \"$RUNNER_TEMP/f62-owned-shadow-build.log\" --failure-receipt \"$RUNNER_TEMP/freerdp-public-owned-fixture/failure.json\" --jobs 2\nbinary=\"$RUNNER_TEMP/f62-owned-shadow-build/server/shadow/cli/freerdp-shadow-cli\"\ntest -x \"$binary\"\n{\n  echo \"RDP_ACCEPTANCE_SHADOW_BINARY=$binary\"\n  echo \"RDP_ACCEPTANCE_SHADOW_BUILD=$RUNNER_TEMP/f62-owned-shadow-build\"\n  echo \"RDP_ACCEPTANCE_SHADOW_SOURCE=$RUNNER_TEMP/f62-owned-shadow-source\"\n} >> \"$GITHUB_ENV\"\n",
          "id": "owned_fixture"
        },
        {
          "name": "Build one exact native ABI with optional channels default-off",
          "env": {
            "GRADLE_USER_HOME": "${{ runner.temp }}/freerdp-gradle"
          },
          "run": "set -euo pipefail\nstudio=\"$RUNNER_TEMP/freerdp-source/client/Android/Studio\"\ncat > \"$studio/release.properties\" <<EOF\nCOMPILE_API=37\nTARGET_API=37\nMIN_API=29\nTOOLS_VERSION=37.0.0\nNDK_VERSION=29.0.13113456\nCMAKE_VERSION=4.1.2\nBUILD_UNIVERSAL=true\nSPLIT_ENABLED=false\nABI_FILTERS=$ABI\nSPLIT_ARCHITECTURES=$ABI\nVERSION_NAME=3.31.1\nVERSION_CODE=3031001\nCMAKE_ARGUMENTS=-DWITH_FFMPEG=OFF;-DWITH_OPENH264=OFF;-DWITH_OPUS=OFF;-DWITH_WEBP=OFF;-DWITH_JPEG=OFF;-DWITH_PNG=OFF;-DWITH_CJSON=ON;-DWITH_OPENSSL=ON\nEOF\ncd \"$studio\"\n./gradlew --no-daemon --stacktrace :freeRDPCore:assembleRelease\n"
        },
        {
          "name": "Create exact package receipt",
          "run": "set -euo pipefail\naar=\"$RUNNER_TEMP/freerdp-source/client/Android/Studio/freeRDPCore/build/outputs/aar/freeRDPCore-release.aar\"\nout=\"$RUNNER_TEMP/freerdp-${ABI}-receipt.json\"\npython3 tool/freerdp_android_package.py receipt \"$aar\" --abi \"$ABI\" --output \"$out\"\nmkdir -p \"$RUNNER_TEMP/freerdp-package\"\ncp \"$aar\" \"$RUNNER_TEMP/freerdp-package/freeRDPCore-${ABI}.aar\"\ncp \"$out\" \"$RUNNER_TEMP/freerdp-package/receipt.json\"\n"
        },
        {
          "uses": "subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2",
          "with": {
            "flutter-version": "3.47.2",
            "channel": "stable",
            "cache": true
          }
        },
        {
          "name": "Compile the receipted runtime into a real Larenor APK",
          "env": {
            "GRADLE_USER_HOME": "${{ runner.temp }}/larenor-gradle"
          },
          "run": "set -euo pipefail\nmkdir -p android/app/freerdp\ncp \"$RUNNER_TEMP/freerdp-package/freeRDPCore-${ABI}.aar\" android/app/freerdp/freeRDPCore.aar\ncp \"$RUNNER_TEMP/freerdp-package/receipt.json\" android/app/freerdp/receipt.json\nflutter pub get\ndart run build_runner build --delete-conflicting-outputs\nif test \"$ABI\" = arm64-v8a; then target=android-arm64; else target=android-x64; fi\nflutter build apk --debug --target-platform \"$target\"\npython3 tool/freerdp_android_package.py verify-apk build/app/outputs/flutter-apk/app-debug.apk android/app/freerdp/receipt.json\n"
        },
        {
          "name": "Enable hosted KVM for packaged acceptance",
          "if": "matrix.abi == 'x86_64'",
          "run": "set -euo pipefail\nif [ ! -c /dev/kvm ]; then\n  echo '::error::The hosted runner has no KVM character device.'\n  exit 1\nfi\nsudo chmod 0666 /dev/kvm\nif [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then\n  ls -l /dev/kvm\n  echo '::error::The runner cannot access KVM after permission setup.'\n  exit 1\nfi\n"
        },
        {
          "name": "Prepare the owned NLA FreeRDP host",
          "if": "matrix.abi == 'x86_64'",
          "run": "set -euo pipefail\numask 077\ntest -s \"$RUNNER_TEMP/xorg.pid\"\nkill -0 \"$(cat \"$RUNNER_TEMP/xorg.pid\")\"\ntest \"$(DISPLAY=:99 xdpyinfo | awk '$1 == \"dimensions:\" {print $2}')\" = 1280x800\ntest \"$(DISPLAY=:99 xrandr --query | awk -v output=\"$RDP_ACCEPTANCE_XORG_OUTPUT\"   '$1 == output && $2 == \"connected\" && $0 ~ /1280x800\\+0\\+0/ {count++} END {print count+0}')\" -eq 1\nfixture_password=\"$(openssl rand -base64 36 | tr -d '=+/\\n' | cut -c1-32)\"\necho \"::add-mask::$fixture_password\"\necho \"RDP_ACCEPTANCE_PASSWORD=$fixture_password\" >> \"$GITHUB_ENV\"\nwinpr-hash3 -u larenor -p \"$fixture_password\" -d LARENOR -f sam -v 1 > \"$RUNNER_TEMP/larenor-rdp.sam\"\nchmod 0600 \"$RUNNER_TEMP/larenor-rdp.sam\"\nDISPLAY=:99 xmodmap -pke | awk '$1 == \"keycode\" && $2 == \"38\" && $3 == \"=\" && $4 == \"a\" && $5 == \"A\" { found=1 } END { exit !found }'\nDISPLAY=:99 xsetroot -solid '#315a9c'\nenv -u RUNNER_TRACKING_ID DISPLAY=:99 nohup xmessage -geometry 460x180+80+80 'Larenor owned NLA RDP acceptance host' > \"$RUNNER_TEMP/freerdp-package/acceptance/xmessage.log\" 2>&1 &\necho $! > \"$RUNNER_TEMP/xmessage.pid\"\n"
        },
        {
          "name": "Prepare isolated microphone source for owned emulator",
          "if": "matrix.abi == 'x86_64'",
          "run": "set -euo pipefail\numask 077\npackages=(pulseaudio pulseaudio-utils)\nfor package in \"${packages[@]}\"; do\n  version=\"$(apt-cache policy \"$package\" | awk '$1 == \"Candidate:\" {print $2}')\"\n  [[ \"$version\" =~ ^[A-Za-z0-9.+:~_-]+$ ]] || exit 1\n  sudo apt-get install --yes --no-install-recommends \"$package=$version\"\n  test \"$(dpkg-query -W -f='${Version}' \"$package\")\" = \"$version\"\ndone\npython3 -B -m tool.f62_owned_microphone prepare \"$RUNNER_TEMP/larenor-rdp-microphone\"\n{\n  echo \"PULSE_SERVER=unix:$RUNNER_TEMP/larenor-rdp-microphone/native\"\n  echo \"PULSE_CLIENTCONFIG=$RUNNER_TEMP/larenor-rdp-microphone/client.conf\"\n  echo \"PULSE_SOURCE=larenor_owned_microphone.monitor\"\n  echo \"PULSE_SINK=larenor_owned_output\"\n  echo \"QEMU_AUDIO_DRV=pa\"\n} >> \"$GITHUB_ENV\"\n"
        },
        {
          "name": "Exercise the packaged Android client against the NLA host",
          "if": "matrix.abi == 'x86_64'",
          "uses": "ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d",
          "timeout-minutes": 30,
          "with": {
            "api-level": 35,
            "arch": "x86_64",
            "target": "default",
            "profile": "pixel_4",
            "ram-size": "2048M",
            "disk-size": "3072M",
            "emulator-boot-timeout": 300,
            "emulator-build": 13823996,
            "emulator-options": "-no-window -gpu swangle_indirect -no-snapshot -allow-host-audio -no-boot-anim -camera-back none -camera-front none",
            "disable-animations": true,
            "disable-spellchecker": true,
            "disable-linux-hw-accel": false,
            "script": "adb emu avd hostmicon\npython3 tool/f62_packaged_acceptance.py"
          },
          "id": "packaged_acceptance"
        },
        {
          "name": "Stop the owned RDP host",
          "if": "always() && matrix.abi == 'x86_64'",
          "run": "set +e\nfor name in shadow xmessage xorg; do\n  pid_file=\"$RUNNER_TEMP/$name.pid\"\n  if test -f \"$pid_file\"; then kill \"$(cat \"$pid_file\")\" 2>/dev/null || true; fi\ndone\nrm -f \"$RUNNER_TEMP/larenor-rdp.sam\"\n\nif test -f \"$RUNNER_TEMP/larenor-rdp-microphone/process.json\"; then\n  python3 -B -m tool.f62_owned_microphone stop \"$RUNNER_TEMP/larenor-rdp-microphone\"\nfi\n"
        },
        {
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "if": "matrix.abi == 'x86_64'",
          "with": {
            "name": "freerdp-3.31.1-${{ github.sha }}-acceptance",
            "path": "${{ runner.temp }}/freerdp-public-acceptance/receipt.json",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "Upload bounded owned fixture build failure",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "if": "failure() && matrix.abi == 'x86_64' && steps.owned_fixture.outcome == 'failure'",
          "with": {
            "name": "freerdp-owned-fixture-${{ github.sha }}-failure-diagnostics",
            "path": "${{ runner.temp }}/freerdp-public-owned-fixture/failure.json",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        },
        {
          "name": "Upload bounded native failure diagnostics",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "if": "failure() && matrix.abi == 'x86_64' && steps.packaged_acceptance.outcome == 'failure'",
          "with": {
            "name": "freerdp-3.31.1-${{ github.sha }}-failure-diagnostics",
            "path": "${{ runner.temp }}/freerdp-public-acceptance/failure.json",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
