name: F60 Sunshine Android discovery

on:
  workflow_call:
    inputs:
      caller_contract:
        description: "Exact registered same-repository dispatcher contract"
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f60-sunshine-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require exact reviewed GitHub-hosted source
        env:
          CALLER_CONTRACT: ${{ inputs.caller_contract || '' }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          case "$GITHUB_REF" in refs/heads/main|refs/heads/codex/project-completion-100) ;; *) exit 1;; esac
          test -z "$PR_HEAD_REPOSITORY"
          test "$GITHUB_REPOSITORY" = ersingundem/larenor
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          case "$GITHUB_WORKFLOW_REF:$CALLER_CONTRACT" in
            "ersingundem/larenor/.github/workflows/f60-sunshine-android-discovery.yml@$GITHUB_REF:") ;;
            "ersingundem/larenor/.github/workflows/server-test.yml@$GITHUB_REF:f60-owned-discovery-v1") ;;
            *) exit 1 ;;
          esac
          test -n "$RUNNER_TEMP"

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Temurin 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install exact Android toolchain
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v3.2.2
        with:
          packages: >-
            emulator platform-tools platforms;android-37.0 build-tools;37.0.0
            ndk;29.0.14206865 system-images;android-35;google_apis;x86_64

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install exact owned-host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          packages=(avahi-daemon avahi-utils openssl pulseaudio pulseaudio-utils x11-utils xvfb)
          for package in "${packages[@]}"; do
            candidate="$(apt-cache policy "$package" | awk '$1 == "Candidate:" {print $2}')"
            case "$candidate" in ""|"(none)") exit 1;; esac
            sudo apt-get install --yes --no-install-recommends "$package=$candidate"
            test "$(dpkg-query --show --showformat='${Version}' "$package")" = "$candidate"
          done
          sudo systemctl start avahi-daemon
          test "$(systemctl is-active avahi-daemon)" = active

      - name: Build and install exact receipted Moonlight engine
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/f60-engine-gradle
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/moonlight-stream/moonlight-android.git "$RUNNER_TEMP/moonlight-source"
          git -C "$RUNNER_TEMP/moonlight-source" checkout --detach b48494cb96bff23d8886c4775cc4f39a1075495d
          git -C "$RUNNER_TEMP/moonlight-source" submodule update --init --recursive
          python3 tool/moonlight_android_package.py verify-source "$RUNNER_TEMP/moonlight-source"
          mkdir "$RUNNER_TEMP/moonlight-package" android/app/moonlight
          python3 tool/moonlight_android_package.py build \
            "$RUNNER_TEMP/moonlight-source" "$RUNNER_TEMP/moonlight-build" \
            "$RUNNER_TEMP/moonlight-package/moonlight-engine.aar" \
            "$RUNNER_TEMP/moonlight-package/receipt.json"
          cp "$RUNNER_TEMP/moonlight-package/moonlight-engine.aar" android/app/moonlight/moonlight-engine.aar
          cp "$RUNNER_TEMP/moonlight-package/receipt.json" android/app/moonlight/receipt.json
          python3 tool/moonlight_android_package.py verify-install \
            android/app/moonlight/moonlight-engine.aar android/app/moonlight/receipt.json
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Enable hosted KVM for owned discovery
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo '::error::The hosted runner has no KVM character device.'
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            ls -l /dev/kvm
            echo '::error::The runner cannot access KVM after permission setup.'
            exit 1
          fi

      - name: Run production NSD against the owned Sunshine host
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: python3 -B -m tool.f60_sunshine_android_discovery

      - name: Upload bounded discovery receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: f60-sunshine-android-discovery-${{ github.sha }}
          path: ${{ runner.temp }}/f60-sunshine-android-discovery-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Stop owned host support service
        if: always()
        run: sudo systemctl stop avahi-daemon || true
