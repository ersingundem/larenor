{
  "name": "S09.2 Component Restore Native Acceptance",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "component-restore-native-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "native-scope": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "outputs": {
        "run": "${{ steps.scope.outputs.run }}",
        "reason": "${{ steps.scope.outputs.reason }}"
      },
      "env": {
        "PR_HEAD_REPOSITORY": "${{ github.event.pull_request.head.repo.full_name }}",
        "PR_BASE_SHA": "${{ github.event.pull_request.base.sha }}",
        "PR_HEAD_SHA": "${{ github.event.pull_request.head.sha }}"
      },
      "steps": [
        {
          "name": "Require reviewed exact workflow source",
          "run": "case \"$GITHUB_EVENT_NAME\" in\n  workflow_dispatch)\n    test \"$GITHUB_REF\" = refs/heads/main\n    test -z \"$GITHUB_BASE_REF\"\n    test -z \"$PR_HEAD_REPOSITORY\"\n    ;;\n  pull_request)\n    test \"$GITHUB_BASE_REF\" = main\n    test \"$PR_HEAD_REPOSITORY\" = \"$GITHUB_REPOSITORY\"\n    case \"$GITHUB_REF\" in refs/pull/*/merge) ;; *) exit 1;; esac\n    ;;\n  *) exit 1;;\nesac\ntest \"$GITHUB_REPOSITORY\" = ersingundem/larenor\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$RUNNER_ENVIRONMENT\" = github-hosted"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Decide whether native evidence changed",
          "id": "scope",
          "run": "case \"$GITHUB_EVENT_NAME\" in\n  pull_request)\n    git show \"$PR_BASE_SHA:tool/native_ci_scope.py\" > \"$RUNNER_TEMP/native_ci_scope.py\"\n    python3 \"$RUNNER_TEMP/native_ci_scope.py\" --github-output \"$GITHUB_OUTPUT\" --summary \"$GITHUB_STEP_SUMMARY\"\n    ;;\n  workflow_dispatch)\n    python3 tool/native_ci_scope.py --github-output \"$GITHUB_OUTPUT\" --summary \"$GITHUB_STEP_SUMMARY\"\n    ;;\n  *) exit 1;;\nesac"
        }
      ]
    },
    "component-restore-native": {
      "needs": "native-scope",
      "if": "needs.native-scope.outputs.run == 'true'",
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "runner": "ubuntu-24.04",
              "platform": "linux/amd64"
            },
            {
              "runner": "ubuntu-24.04-arm",
              "platform": "linux/arm64"
            }
          ]
        }
      },
      "env": {
        "EXPECTED_PLATFORM": "${{ matrix.platform }}",
        "PR_HEAD_REPOSITORY": "${{ github.event.pull_request.head.repo.full_name }}",
        "PR_BASE_SHA": "${{ github.event.pull_request.base.sha }}",
        "PR_HEAD_SHA": "${{ github.event.pull_request.head.sha }}"
      },
      "steps": [
        {
          "name": "Require reviewed exact workflow source",
          "run": "case \"$GITHUB_EVENT_NAME\" in\n  workflow_dispatch)\n    test \"$GITHUB_REF\" = refs/heads/main\n    test -z \"$GITHUB_BASE_REF\"\n    test -z \"$PR_HEAD_REPOSITORY\"\n    ;;\n  pull_request)\n    test \"$GITHUB_BASE_REF\" = main\n    test \"$PR_HEAD_REPOSITORY\" = \"$GITHUB_REPOSITORY\"\n    case \"$GITHUB_REF\" in refs/pull/*/merge) ;; *) exit 1;; esac\n    ;;\n  *) exit 1;;\nesac\ntest \"$GITHUB_REPOSITORY\" = ersingundem/larenor\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$RUNNER_ENVIRONMENT\" = github-hosted"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Prepare pinned isolated Python tooling",
          "run": "python3 -m venv \"$RUNNER_TEMP/component-restore-ci-tools\"\n\"$RUNNER_TEMP/component-restore-ci-tools/bin/python\" -m pip install --disable-pip-version-check --only-binary=:all: uv==0.12.10\n{\n  echo \"UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/component-restore-venv\"\n  echo \"UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/component-restore-python\"\n} >> \"$GITHUB_ENV\"\necho \"$RUNNER_TEMP/component-restore-ci-tools/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "Install reviewed dependency lock",
          "working-directory": "server",
          "run": "uv sync --locked --python 3.12.14"
        },
        {
          "name": "Check installed dependency consistency",
          "run": "uv pip check --python \"$UV_PROJECT_ENVIRONMENT/bin/python\""
        },
        {
          "name": "Run native restore authority and power-loss acceptance",
          "timeout-minutes": 15,
          "run": "set -euo pipefail\nactual=\"$(uname -m)\"\ncase \"$EXPECTED_PLATFORM:$actual\" in\n  linux/amd64:x86_64|linux/arm64:aarch64) ;;\n  *) exit 1;;\nesac\nexport PYTHONPATH=\"$GITHUB_WORKSPACE/server:$GITHUB_WORKSPACE/server/tests\"\n\"$UV_PROJECT_ENVIRONMENT/bin/python\" -B -m pytest -q \\\n  server/tests/test_core_backup_component_linux_restore.py \\\n  server/tests/test_core_backup_component_docker_adapter.py \\\n  server/tests/test_core_backup_component_installation_authority.py \\\n  server/tests/test_core_backup_component_restore.py \\\n  server/tests/test_core_backup_component_restore_recovery.py \\\n  server/tests/test_core_backup_component_restore_runtime.py \\\n  server/tests/test_core_backup_component_restore_product.py \\\n  server/tests/test_core_backup_restore_cli_components.py\nsudo --preserve-env=PYTHONPATH,EXPECTED_PLATFORM \\\n  \"$UV_PROJECT_ENVIRONMENT/bin/python\" -B -m pytest -q \\\n  server/tests/test_core_backup_component_restore_native_cli.py"
        }
      ]
    },
    "native-acceptance": {
      "name": "component-restore-native-acceptance",
      "if": "always()",
      "needs": [
        "native-scope",
        "component-restore-native"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Require the scoped native result",
          "env": {
            "RUN_NATIVE": "${{ needs.native-scope.outputs.run }}",
            "SCOPE_RESULT": "${{ needs.native-scope.result }}",
            "MATRIX_RESULT": "${{ needs.component-restore-native.result }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "python3 tool/required_ci_aggregate.py native"
        }
      ],
      "permissions": {
        "contents": "read",
        "pull-requests": "read"
      }
    }
  }
}
