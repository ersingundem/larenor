{
  "name": "F61 TigerVNC Native Acceptance",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/vnc-native-acceptance.yml",
        "android/app/src/main/kotlin/com/ersingundem/larenor/vnc/**",
        "android/app/src/test/kotlin/com/ersingundem/larenor/vnc/**",
        "lib/features/remote_access/vnc/**",
        "lib/features/remote_access/vnc_native_bridge.dart",
        "lib/features/remote_access/vnc_framebuffer_surface.dart",
        "test/features/remote_access/vnc/**",
        "test/features/remote_access/vnc_native_bridge_test.dart",
        "test/features/remote_access/vnc_framebuffer_surface_test.dart",
        "tool/f61_tigervnc_acceptance.py",
        "tool/tests/vnc_native_workflow_test.py",
        "tool/android_acceptance_gradle.py",
        "tool/native_acceptance_receipt.py"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "f61-tigervnc-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "tigervnc": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "env": {
        "PR_HEAD_REPOSITORY": "${{ github.event.pull_request.head.repo.full_name }}"
      },
      "steps": [
        {
          "name": "Set isolated Gradle home",
          "run": "set -euo pipefail\necho \"GRADLE_USER_HOME=$RUNNER_TEMP/f61-gradle\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "name": "Require reviewed GitHub-hosted execution",
          "run": "case \"$GITHUB_EVENT_NAME\" in\n  workflow_dispatch) case \"$GITHUB_REF\" in refs/heads/main|refs/heads/codex/project-completion-100) ;; *) exit 1;; esac; test -z \"$PR_HEAD_REPOSITORY\";;\n  pull_request) test \"$GITHUB_BASE_REF\" = main; test \"$PR_HEAD_REPOSITORY\" = \"$GITHUB_REPOSITORY\"; case \"$GITHUB_REF\" in refs/pull/*/merge) ;; *) exit 1;; esac;;\n  *) exit 1;;\nesac\ntest \"$GITHUB_REPOSITORY\" = ersingundem/larenor\ntest \"$GITHUB_WORKFLOW_SHA\" = \"$GITHUB_SHA\"\ntest \"$RUNNER_ENVIRONMENT\" = github-hosted\n"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2",
          "with": {
            "flutter-version": "3.47.2",
            "channel": "stable",
            "cache": true
          }
        },
        {
          "name": "Install the recorded TigerVNC fixture",
          "run": "set -euo pipefail\nsudo apt-get update -qq\ntigervnc_version=\"$(apt-cache policy tigervnc-standalone-server | awk '/Candidate:/ {print $2}')\"\ntools_version=\"$(apt-cache policy tigervnc-tools | awk '/Candidate:/ {print $2}')\"\ntest -n \"$tigervnc_version\" && test \"$tigervnc_version\" != '(none)'\ntest -n \"$tools_version\" && test \"$tools_version\" != '(none)'\nsudo apt-get install --yes --no-install-recommends \\\n  \"tigervnc-standalone-server=$tigervnc_version\" \\\n  \"tigervnc-tools=$tools_version\" \\\n  iproute2 openssl x11-utils x11-xserver-utils xdotool xterm xfonts-base\ntest \"$(dpkg-query -W -f='${Version}' tigervnc-standalone-server)\" = \"$tigervnc_version\"\necho \"TIGERVNC_PACKAGE_VERSION=$tigervnc_version\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "name": "Resolve Flutter packages",
          "run": "set -euo pipefail\nflutter pub get --enforce-lockfile\n"
        },
        {
          "name": "Generate localizations for the application build",
          "run": "flutter gen-l10n"
        },
        {
          "name": "Generate model and provider outputs for the application build",
          "run": "dart run build_runner build --delete-conflicting-outputs"
        },
        {
          "name": "Run production bridge against owned X509Vnc host",
          "run": "set -euo pipefail\npython3 tool/f61_tigervnc_acceptance.py\n"
        },
        {
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "if": "always()",
          "with": {
            "name": "f61-tigervnc-${{ github.sha }}",
            "path": "build/f61-tigervnc-acceptance/receipt.json",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
