{
  "name": "Server Container Build",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "publish": {
          "description": "Publish verified images from current trusted main",
          "type": "boolean",
          "required": false,
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "server-image-main",
    "cancel-in-progress": true
  },
  "env": {
    "IMAGE": "ghcr.io/ersingundem/larenor-server",
    "DOCKER_BUILD_RECORD_UPLOAD": "false"
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "jobs": {
    "server-test": {
      "if": "github.repository == 'ersingundem/larenor' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')",
      "uses": "./.github/workflows/server-test.yml"
    },
    "build-test": {
      "if": "github.repository == 'ersingundem/larenor' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')",
      "needs": [
        "server-test"
      ],
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 35,
      "permissions": {
        "contents": "read",
        "packages": "write"
      },
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "arch": "amd64",
              "runner": "ubuntu-24.04"
            },
            {
              "arch": "arm64",
              "runner": "ubuntu-24.04-arm"
            }
          ]
        }
      },
      "env": {
        "ARCH": "${{ matrix.arch }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Check container publication policy",
          "run": "python3 tool/tests/server_container_policy_test.py"
        },
        {
          "name": "Name the local architecture image",
          "run": "echo \"LOCAL_IMAGE=larenor-server:ci-$ARCH\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "uses": "docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e"
        },
        {
          "name": "Prepare immutable registry lookup",
          "run": "cat > \"$RUNNER_TEMP/registry-probe.py\" <<'PY'\nimport base64\nimport json\nimport os\nimport re\nimport sys\nfrom urllib.error import HTTPError\nfrom urllib.parse import urlencode\nfrom urllib.request import Request, urlopen\n\ndef registry_digest(image, tag, actor, credential, opener=urlopen):\n    if not re.fullmatch(r\"ghcr\\.io/[a-z0-9_.-]+/[a-z0-9_.-]+\", image):\n        raise ValueError(\"Invalid image repository\")\n    if not re.fullmatch(r\"sha-[0-9a-f]{40}(?:-(?:amd64|arm64))?\", tag):\n        raise ValueError(\"Only immutable commit tags may be probed\")\n    repository = image.removeprefix(\"ghcr.io/\")\n    query = urlencode({\"service\": \"ghcr.io\", \"scope\": f\"repository:{repository}:pull,push\"})\n    basic = base64.b64encode(f\"{actor}:{credential}\".encode()).decode()\n    request = Request(\"https://ghcr.io/token?\" + query,\n                      headers={\"Authorization\": \"Basic \" + basic})\n    with opener(request, timeout=30) as response:\n        token = json.load(response)[\"token\"]\n    request = Request(f\"https://ghcr.io/v2/{repository}/manifests/{tag}\", method=\"HEAD\",\n                      headers={\"Authorization\": \"Bearer \" + token,\n                               \"Accept\": \"application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json\"})\n    try:\n        with opener(request, timeout=30) as response:\n            digest = response.headers.get(\"Docker-Content-Digest\", \"\")\n            if response.status != 200 or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", digest):\n                raise RuntimeError(\"Registry returned an invalid manifest digest\")\n            return digest\n    except HTTPError as error:\n        if error.code == 404:\n            return \"\"\n        raise RuntimeError(f\"Registry lookup failed with HTTP {error.code}\") from None\n\nif __name__ == \"__main__\":\n    print(registry_digest(sys.argv[1], sys.argv[2], os.environ[\"GITHUB_ACTOR\"], os.environ[\"GH_TOKEN\"]))\nPY\n"
        },
        {
          "name": "Authenticate only for authorized publication",
          "if": "github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)",
          "uses": "docker/login-action@dbcb813823bdd20940b903addbd779551569679f",
          "with": {
            "registry": "ghcr.io",
            "username": "${{ github.actor }}",
            "password": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "id": "existing",
          "name": "Find an existing immutable architecture image",
          "if": "github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "digest=$(python3 \"$RUNNER_TEMP/registry-probe.py\" \"$IMAGE\" \"sha-$GITHUB_SHA-$ARCH\")\nprintf 'digest=%s\\n' \"$digest\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "name": "Reuse an existing image by immutable digest",
          "if": "steps.existing.outputs.digest != ''",
          "env": {
            "EXISTING_DIGEST": "${{ steps.existing.outputs.digest }}"
          },
          "run": "docker pull \"$IMAGE@$EXISTING_DIGEST\"\ndocker tag \"$IMAGE@$EXISTING_DIGEST\" \"$LOCAL_IMAGE\"\n"
        },
        {
          "name": "Build native image without publishing",
          "if": "steps.existing.outputs.digest == ''",
          "uses": "docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a",
          "with": {
            "context": ".",
            "file": "server/Dockerfile",
            "platforms": "linux/${{ matrix.arch }}",
            "load": true,
            "push": false,
            "provenance": false,
            "sbom": false,
            "github-token": "",
            "tags": "larenor-server:ci-${{ matrix.arch }}",
            "build-args": "LARENOR_REPOSITORY_URL=https://github.com/${{ github.repository }}\nLARENOR_SOURCE_REVISION=${{ github.sha }}"
          }
        },
        {
          "name": "Smoke-test the exact image before publication",
          "run": "state=\"$RUNNER_TEMP/larenor-container-state\"\ninstall -d -m 0700 \"$state/data\" \"$state/secrets\"\nsudo chown -R 10001:10001 \"$state\"\nname=\"larenor-smoke-$ARCH\"\ntrap 'docker rm --force \"$name\" >/dev/null 2>&1 || true' EXIT\ncommon=(--read-only --cap-drop ALL --security-opt no-new-privileges:true\n        --pids-limit 128 --memory 1g --cpus 2\n        --tmpfs \"/tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m\"\n        --mount \"type=bind,src=$state/data,dst=/data\"\n        --mount \"type=bind,src=$state/secrets,dst=/secrets\")\ndocker run --rm --network none \"${common[@]}\" \"$LOCAL_IMAGE\" --initialize-only\ndocker run --detach --name \"$name\" \"${common[@]}\"       --publish 127.0.0.1::8098       --mount \"type=bind,src=$GITHUB_WORKSPACE/android/app/src/test/resources/updater/aosp-signed-apk.fixture,dst=/fixtures/signed.apk,readonly\"       \"$LOCAL_IMAGE\" >/dev/null\nexport SMOKE_CONTAINER=\"$name\"\npython3 - <<'PY'\nimport hashlib\nimport json\nimport os\nimport re\nimport subprocess\nimport time\nfrom urllib.error import HTTPError, URLError\nfrom urllib.request import urlopen\n\nname = os.environ['SMOKE_CONTAINER']\ndef healthy():\n    for _ in range(60):\n        try:\n            # Docker may assign a new ephemeral host port when restarted.\n            binding = subprocess.check_output(['docker', 'port', name, '8098/tcp'], text=True, timeout=5).strip()\n            match = re.fullmatch(r'127\\.0\\.0\\.1:([0-9]{1,5})', binding)\n            assert match and 1 <= int(match[1]) <= 65535, 'Unexpected smoke port binding'\n            base = 'http://127.0.0.1:' + match[1] + '/api/v1'\n            with urlopen(base + '/health', timeout=2) as response:\n                assert json.load(response) == {'service': 'larenor-server', 'apiVersion': 1}\n            return base\n        except (OSError, URLError, subprocess.CalledProcessError, subprocess.TimeoutExpired):\n            time.sleep(1)\n    for command in (['docker', 'inspect', '--format', '{{json .State}}', name],\n                    ['docker', 'logs', '--tail', '80', name]):\n        try:\n            subprocess.run(command, check=False, timeout=10)\n        except (OSError, subprocess.TimeoutExpired):\n            pass\n    raise AssertionError('Container never became healthy')\nbase = healthy()\nwith urlopen(base + '/source', timeout=3) as response:\n    source = json.load(response)\nrepository = 'https://github.com/' + os.environ['GITHUB_REPOSITORY']\nrevision = os.environ['GITHUB_SHA']\nassert source['sourceRevision'] == revision\nassert source['sourceUrl'] == repository + '/tree/' + revision\nassert source['licenseUrl'] == repository + '/blob/' + revision + '/LICENSE'\nassert source['license'] == 'AGPL-3.0-only'\nfor path in ['/context', '/vault', '/admin/users', '/client/releases/latest']:\n    try:\n        urlopen(base + path, timeout=3)\n    except HTTPError as error:\n        assert error.code == 401, (path, error.code)\n    else:\n        raise AssertionError('Unauthenticated protected API accepted')\nimage = json.loads(subprocess.check_output(['docker', 'image', 'inspect', os.environ['LOCAL_IMAGE']]))[0]\nassert image['Architecture'] == os.environ['ARCH'] and image['Os'] == 'linux'\nconfig = json.loads(subprocess.check_output(['docker', 'inspect', name]))[0]\nassert config['Config']['User'] == '10001:10001'\nassert config['HostConfig']['ReadonlyRootfs'] is True\nassert config['Config']['Labels']['org.opencontainers.image.revision'] == revision\nassert config['Config']['Labels']['org.opencontainers.image.source'] == repository\nassert config['Config']['Labels']['org.opencontainers.image.licenses'] == 'AGPL-3.0-only'\nprivate_check = \"\"\"import hashlib,json,os,stat\nfrom pathlib import Path\nassert os.geteuid() == 10001\nfor directory in ['/data', '/secrets']:\n    info=Path(directory).stat()\n    assert info.st_uid == 10001 and stat.S_IMODE(info.st_mode) == 0o700\npaths=['/data/bootstrap-admin.txt','/secrets/vault.key','/secrets/publisher.token']\nfor path in paths:\n    info=Path(path).stat()\n    assert info.st_uid == 10001 and stat.S_IMODE(info.st_mode) == 0o600\nstate={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}\nfrom larenor_server.config import Settings\nfrom larenor_server.core import CoreServices\ncontext=CoreServices(Settings.from_environment()).context.model_dump()\nassert set(context) == {'schemaVersion','coreId','homeId'} and context['schemaVersion'] == 1\nstate['core_context']=hashlib.sha256(json.dumps(context,sort_keys=True).encode()).hexdigest()\nprint(json.dumps(state))\n\"\"\"\ndef private_state():\n    return subprocess.check_output(['docker','exec',name,'python','-c',private_check])\nbefore = private_state()\nverifier_check = \"\"\"from pathlib import Path\nimport hashlib\nfrom larenor_server.errors import ApiError\nfrom larenor_server.releases.verifier import JavaApkVerifier\nfixture=Path('/fixtures/signed.apk')\nassert hashlib.sha256(fixture.read_bytes()).hexdigest() == '020b4e92bd80c016f960ab98952afa0975dca0a0a6612103514d867351d23559'\nverifier=JavaApkVerifier(Path('/usr/bin/java'),Path('/opt/larenor/verifier/apksig.jar'),Path('/opt/larenor/verifier/classes'))\nresult=verifier.verify(fixture)\nassert result['verified'] is True and result['debuggable'] is False\nassert result['certificateSha256'] == 'fb5dbd3c669af9fc236c6991e6387b7f11ff0590997f22d0f5c74ff40e04fca8'\nassert result['applicationId'] == 'android.appsecurity.cts.tinyapp' and result['versionCode'] == 10\ntry:\n    verifier.verify(Path('/usr/share/doc/larenor-server/LICENSE'))\nexcept ApiError as error:\n    assert error.code == 'release_verification_failed'\nelse:\n    raise AssertionError('Non-APK accepted')\n\"\"\"\nsubprocess.run(['docker','exec',name,'python','-c',verifier_check], check=True)\nsubprocess.run(['docker','restart','--time','10',name], check=True, stdout=subprocess.DEVNULL)\nhealthy()\nassert private_state() == before, 'Restart changed initialized credentials or Core context'\nprint('Read-only image, private persistence, protected APIs and real APK verification passed.')\nPY\n"
        },
        {
          "id": "current",
          "name": "Recheck trusted main before architecture publication",
          "if": "github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "current=$(gh api \"repos/$GITHUB_REPOSITORY/git/ref/heads/main\" --jq '.object.sha')\nif [ \"$current\" = \"$GITHUB_SHA\" ]; then\n  echo 'current=true' >> \"$GITHUB_OUTPUT\"\nelse\n  echo 'current=false' >> \"$GITHUB_OUTPUT\"\n  echo 'A newer main commit exists; this run will not publish.'\nfi\n"
        },
        {
          "name": "Publish a new immutable architecture tag",
          "if": "steps.current.outputs.current == 'true' && steps.existing.outputs.digest == ''",
          "run": "existing=$(python3 \"$RUNNER_TEMP/registry-probe.py\" \"$IMAGE\" \"sha-$GITHUB_SHA-$ARCH\")\nif [ -n \"$existing\" ]; then\n  echo 'The immutable tag appeared during testing; rerun to test that digest. Refusing to overwrite it.'\n  exit 1\nfi\ntag=\"$IMAGE:sha-$GITHUB_SHA-$ARCH\"\ndocker tag \"$LOCAL_IMAGE\" \"$tag\"\ndocker push \"$tag\"\n",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          }
        }
      ]
    },
    "publish-manifest": {
      "if": "github.repository == 'ersingundem/larenor' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))",
      "needs": [
        "server-test",
        "build-test"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read",
        "packages": "write"
      },
      "steps": [
        {
          "uses": "docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e"
        },
        {
          "name": "Prepare immutable registry lookup",
          "run": "cat > \"$RUNNER_TEMP/registry-probe.py\" <<'PY'\nimport base64\nimport json\nimport os\nimport re\nimport sys\nfrom urllib.error import HTTPError\nfrom urllib.parse import urlencode\nfrom urllib.request import Request, urlopen\n\ndef registry_digest(image, tag, actor, credential, opener=urlopen):\n    if not re.fullmatch(r\"ghcr\\.io/[a-z0-9_.-]+/[a-z0-9_.-]+\", image):\n        raise ValueError(\"Invalid image repository\")\n    if not re.fullmatch(r\"sha-[0-9a-f]{40}(?:-(?:amd64|arm64))?\", tag):\n        raise ValueError(\"Only immutable commit tags may be probed\")\n    repository = image.removeprefix(\"ghcr.io/\")\n    query = urlencode({\"service\": \"ghcr.io\", \"scope\": f\"repository:{repository}:pull,push\"})\n    basic = base64.b64encode(f\"{actor}:{credential}\".encode()).decode()\n    request = Request(\"https://ghcr.io/token?\" + query,\n                      headers={\"Authorization\": \"Basic \" + basic})\n    with opener(request, timeout=30) as response:\n        token = json.load(response)[\"token\"]\n    request = Request(f\"https://ghcr.io/v2/{repository}/manifests/{tag}\", method=\"HEAD\",\n                      headers={\"Authorization\": \"Bearer \" + token,\n                               \"Accept\": \"application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json\"})\n    try:\n        with opener(request, timeout=30) as response:\n            digest = response.headers.get(\"Docker-Content-Digest\", \"\")\n            if response.status != 200 or not re.fullmatch(r\"sha256:[0-9a-f]{64}\", digest):\n                raise RuntimeError(\"Registry returned an invalid manifest digest\")\n            return digest\n    except HTTPError as error:\n        if error.code == 404:\n            return \"\"\n        raise RuntimeError(f\"Registry lookup failed with HTTP {error.code}\") from None\n\nif __name__ == \"__main__\":\n    print(registry_digest(sys.argv[1], sys.argv[2], os.environ[\"GITHUB_ACTOR\"], os.environ[\"GH_TOKEN\"]))\nPY\n"
        },
        {
          "id": "current",
          "name": "Require current main after both architectures passed",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "current=$(gh api \"repos/$GITHUB_REPOSITORY/git/ref/heads/main\" --jq '.object.sha')\nif [ \"$current\" = \"$GITHUB_SHA\" ]; then\n  echo 'current=true' >> \"$GITHUB_OUTPUT\"\nelse\n  echo 'current=false' >> \"$GITHUB_OUTPUT\"\n  echo 'A newer main commit exists; this run will not publish.'\nfi\n"
        },
        {
          "name": "Authenticate for manifest publication",
          "if": "steps.current.outputs.current == 'true'",
          "uses": "docker/login-action@dbcb813823bdd20940b903addbd779551569679f",
          "with": {
            "registry": "ghcr.io",
            "username": "${{ github.actor }}",
            "password": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "name": "Create the immutable index and promote current main",
          "if": "steps.current.outputs.current == 'true'",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "amd64=$(python3 \"$RUNNER_TEMP/registry-probe.py\" \"$IMAGE\" \"sha-$GITHUB_SHA-amd64\")\narm64=$(python3 \"$RUNNER_TEMP/registry-probe.py\" \"$IMAGE\" \"sha-$GITHUB_SHA-arm64\")\ntest -n \"$amd64\" && test -n \"$arm64\"\ncommit=$(python3 \"$RUNNER_TEMP/registry-probe.py\" \"$IMAGE\" \"sha-$GITHUB_SHA\")\nif [ -n \"$commit\" ]; then\n  docker buildx imagetools inspect \"$IMAGE@$commit\" --raw > \"$RUNNER_TEMP/server-index.json\"\n  python3 - \"$RUNNER_TEMP/server-index.json\" \"$amd64\" \"$arm64\" <<'PY'\nimport json,sys\nwith open(sys.argv[1]) as stream:\n    index=json.load(stream)\nexpected={('linux','amd64',sys.argv[2]),('linux','arm64',sys.argv[3])}\nobserved={(m['platform']['os'],m['platform']['architecture'],m['digest']) for m in index['manifests']}\nassert len(index['manifests']) == 2 and observed == expected, 'Existing commit index does not match tested images'\nPY\nelse\n  docker buildx imagetools create --tag \"$IMAGE:sha-$GITHUB_SHA\" \"$IMAGE@$amd64\" \"$IMAGE@$arm64\"\n  commit=$(python3 \"$RUNNER_TEMP/registry-probe.py\" \"$IMAGE\" \"sha-$GITHUB_SHA\")\n  test -n \"$commit\"\nfi\ncurrent=$(gh api \"repos/$GITHUB_REPOSITORY/git/ref/heads/main\" --jq '.object.sha')\nif [ \"$current\" != \"$GITHUB_SHA\" ]; then\n  echo 'Main advanced before stable promotion; stable was left unchanged.'\n  exit 0\nfi\ndocker buildx imagetools create --tag \"$IMAGE:stable\" \"$IMAGE@$commit\"\nprintf 'Verified multiarch image: %s@%s\\n' \"$IMAGE\" \"$commit\" >> \"$GITHUB_STEP_SUMMARY\"\n"
        }
      ]
    }
  }
}
