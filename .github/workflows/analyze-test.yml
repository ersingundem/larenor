name: Analyze & Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyze-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - run: flutter pub get --enforce-lockfile

      - run: dart run build_runner build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      - name: Unit, widget, security and resilience regressions
        run: |
          set -o pipefail
          flutter test --coverage --reporter expanded --timeout 90s 2>&1 | tee test-results.log

      - name: Preserve test evidence
        id: test_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-evidence
          path: |
            coverage/lcov.info
            test-results.log
          retention-days: 14

      - name: Report unavailable test artifact
        if: always() && steps.test_evidence.outcome == 'failure'
        run: |
          echo "::warning::Test artifact upload failed. Test results remain in this job's logs; test failures still block delivery."
          echo 'Test artifact upload was unavailable. Inspect the unit/widget test step logs for results.' >> "$GITHUB_STEP_SUMMARY"
